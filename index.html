
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <h2 class="logo">Task<span>Flow</span></h2>
        <nav>
            <a href="#" class="active">Dashboard</a>
            <a href="#taskList">My Tasks</a>
            <a href="#taskForm">Add Task</a>
        </nav>
        <p class="sidebar-footer">Stay focused. Get things done.</p>
    </aside>

    <main class="main-content">

        <header>
            <div>
                <h1>Dashboard</h1>
                <p>Organize your work and achieve your goals.</p>
            </div>
            <span class="user">👤 User</span>
        </header>

        <!-- Statistics -->
        <section class="stats">
            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>
            <div class="stat-card">
                <h3>In Progress</h3>
                <p id="progressTasks">0</p>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>
        </section>

        <!-- Progress -->
        <section class="progress-section">
            <div class="progress-heading">
                <h3>Overall Progress</h3>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
        </section>

        <!-- Add/Edit Form -->
        <section class="task-form" id="taskForm">
            <h2 id="formHeading">Add New Task</h2>

            <form id="addTaskForm">
                <input type="hidden" id="editTaskId">

                <input type="text" id="taskTitle"
                    placeholder="Enter task title" required>

                <textarea id="taskDescription"
                    placeholder="Enter task description"></textarea>

                <div class="form-row">
                    <select id="taskPriority">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>

                    <input type="date" id="taskDate">

                    <select id="taskStatus">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="submitButton">+ Add Task</button>
                    <button type="button" id="cancelEdit"
                        class="cancel-btn" hidden>Cancel Edit</button>
                </div>
            </form>
        </section>

        <!-- Task List -->
        <section class="tasks-section" id="taskList">

            <div class="task-heading">
                <h2>My Tasks</h2>

                <div class="task-controls">
                    <input type="search" id="searchTask"
                        placeholder="Search tasks...">

                    <select id="filterStatus">
                        <option value="All">All Tasks</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
            </div>

            <div id="tasksContainer"></div>

        </section>

    </main>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    const addTaskForm = document.getElementById("addTaskForm");
    const tasksContainer = document.getElementById("tasksContainer");
    const filterStatus = document.getElementById("filterStatus");
    const searchTask = document.getElementById("searchTask");

    // Save tasks
    function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    // Add or update task
    addTaskForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const editId = document.getElementById("editTaskId").value;

        const taskData = {
            title: document.getElementById("taskTitle").value.trim(),
            description: document.getElementById("taskDescription").value.trim(),
            priority: document.getElementById("taskPriority").value,
            date: document.getElementById("taskDate").value,
            status: document.getElementById("taskStatus").value
        };

        if (!taskData.title) return;

        if (editId) {
            tasks = tasks.map(task =>
                task.id === Number(editId)
                    ? {...task, ...taskData}
                    : task
            );
        } else {
            tasks.push({
                id: Date.now(),
                ...taskData
            });
        }

        saveTasks();
        resetForm();
        displayTasks();
    });

    // Reset form
    function resetForm() {
        addTaskForm.reset();
        document.getElementById("editTaskId").value = "";
        document.getElementById("formHeading").textContent = "Add New Task";
        document.getElementById("submitButton").textContent = "+ Add Task";
        document.getElementById("cancelEdit").hidden = true;
    }

    // Edit task
    function editTask(id) {
        const task = tasks.find(task => task.id === id);

        if (!task) return;

        document.getElementById("editTaskId").value = task.id;
        document.getElementById("taskTitle").value = task.title;
        document.getElementById("taskDescription").value = task.description;
        document.getElementById("taskPriority").value = task.priority;
        document.getElementById("taskDate").value = task.date;
        document.getElementById("taskStatus").value = task.status;

        document.getElementById("formHeading").textContent = "Edit Task";
        document.getElementById("submitButton").textContent = "Save Changes";
        document.getElementById("cancelEdit").hidden = false;

        document.getElementById("taskForm").scrollIntoView({
            behavior: "smooth"
        });
    }

    // Delete task
    function deleteTask(id) {
        if (!confirm("Are you sure you want to delete this task?")) return;

        tasks = tasks.filter(task => task.id !== id);

        saveTasks();
        displayTasks();
    }

    // Update task status
    function updateStatus(id, status) {
        tasks = tasks.map(task =>
            task.id === id ? {...task, status} : task
        );

        saveTasks();
        displayTasks();
    }

    // Check overdue tasks
    function isOverdue(task) {
        return task.date &&
            task.date < getToday() &&
            task.status !== "Completed";
    }

    function getToday() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    // Display tasks
    function displayTasks() {
        tasksContainer.innerHTML = "";

        const status = filterStatus.value;
        const search = searchTask.value.toLowerCase().trim();

        const filteredTasks = tasks.filter(task => {
            const matchesStatus =
                status === "All" || task.status === status;

            const matchesSearch =
                task.title.toLowerCase().includes(search) ||
                task.description.toLowerCase().includes(search);

            return matchesStatus && matchesSearch;
        });

        if (filteredTasks.length === 0) {
            tasksContainer.innerHTML =
                '<p class="empty-message">No matching tasks found.</p>';
        }

        filteredTasks.forEach(task => {
            const card = document.createElement("div");
            card.className = "task-card";

            const title = document.createElement("h3");
            title.textContent = task.title;

            const description = document.createElement("p");
            description.textContent = task.description || "No description";

            const details = document.createElement("div");
            details.className = "task-details";

            const priority = document.createElement("span");
            priority.textContent = "Priority: " + task.priority;
            priority.className = "priority " + task.priority.toLowerCase();

            const date = document.createElement("span");
            date.textContent = task.date
                ? "Due: " + task.date
                : "No due date";

            details.append(priority, date);

            if (isOverdue(task)) {
                const overdue = document.createElement("span");
                overdue.className = "overdue";
                overdue.textContent = "OVERDUE";
                details.appendChild(overdue);
            }

            const statusSelect = document.createElement("select");

            ["Pending", "In Progress", "Completed"].forEach(value => {
                const option = document.createElement("option");
                option.value = value;
                option.textContent = value;
                statusSelect.appendChild(option);
            });

            statusSelect.value = task.status;

            statusSelect.addEventListener("change", () => {
                updateStatus(task.id, statusSelect.value);
            });

            const actions = document.createElement("div");
            actions.className = "actions";

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.className = "edit-btn";
            editButton.addEventListener("click", () => editTask(task.id));

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";
            deleteButton.addEventListener("click", () => deleteTask(task.id));

            actions.append(editButton, deleteButton);

            card.append(title, description, details, statusSelect, actions);
            tasksContainer.appendChild(card);
        });

        updateStatistics();
    }

    // Dashboard statistics
    function updateStatistics() {
        const total = tasks.length;
        const pending = tasks.filter(t => t.status === "Pending").length;
        const progress = tasks.filter(t => t.status === "In Progress").length;
        const completed = tasks.filter(t => t.status === "Completed").length;

        document.getElementById("totalTasks").textContent = total;
        document.getElementById("pendingTasks").textContent = pending;
        document.getElementById("progressTasks").textContent = progress;
        document.getElementById("completedTasks").textContent = completed;

        const percentage = total === 0
            ? 0
            : Math.round((completed / total) * 100);

        document.getElementById("progressPercent").textContent =
            percentage + "%";

        document.getElementById("progressFill").style.width =
            percentage + "%";
    }

    // Search and filter
    searchTask.addEventListener("input", displayTasks);
    filterStatus.addEventListener("change", displayTasks);

    // Cancel editing
    document.getElementById("cancelEdit").addEventListener("click", resetForm);

    // Initial display
    displayTasks();
</script>

</body>
</html>
